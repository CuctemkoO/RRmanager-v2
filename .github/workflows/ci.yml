name: CI

on:
  push:
    branches:
      - main
      - bugfix      # Обычная сборка без публикации
    tags:
      - "v*"       # Только теги формата v3.0-21 запускают публикацию
  workflow_dispatch:
    inputs:
      spksrc:
        description: "branch"
        required: false
        type: string
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - "x64-7.0"
          - "aarch64-7.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Install Dependencies
        run: |
          cd rr-manager
          npm install
          npm run build

      - name: Checkout SynoCommunity Source and Docker Image
        run: |
          # Clone the specific spksrc fork required for this project
          git clone --depth=1 https://github.com/DigitalBox98/spksrc.git "${{ github.workspace }}/spksrc-fork"

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Build Package
        run: |
          ROOT_PATH="${{ github.workspace }}"
          # Run the build using the standard spksrc docker image but mounting our forked spksrc
          # We mount the forked spksrc to /spksrc inside the container, overriding the image content
          docker run --rm \
            -v "${ROOT_PATH}/spksrc-fork:/spksrc" \
            -v "${ROOT_PATH}/rr-manager:/spksrc/spk/rr-manager" \
            -w /spksrc/spk/rr-manager \
            ghcr.io/synocommunity/spksrc:latest \
            make arch-${{ matrix.target }}

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            spksrc/packages/*.spk

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            spksrc/packages/*.spk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
