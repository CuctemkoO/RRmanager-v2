name: CI

on:
  push:
    branches:
      - main
      - bugfix      # Обычная сборка без публикации
      - pre-release # Pre-release сборка с префиксом dev-
    tags:
      - "v*"       # Только теги формата v3.0-21 запускают публикацию
  workflow_dispatch:
    inputs:
      spksrc:
        description: "branch"
        required: false
        type: string
      version:
        description: "format %y.%-m.$i or auto"
        required: false
        type: string
      prerelease:
        description: "pre release"
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - "x64-7.0"
          - "aarch64-7.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: |
          cd rr-manager
          npm install
          npm run build

      - name: Checkout SynoCommunity Source and Docker Image
        run: |
          # Clone the specific spksrc fork required for this project
          git clone --depth=1 https://github.com/DigitalBox98/spksrc.git "${{ github.workspace }}/spksrc-fork"

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true

      - name: Build Package
        run: |
          ROOT_PATH="${{ github.workspace }}"
          # Run the build using the standard spksrc docker image but mounting our forked spksrc
          # We mount the forked spksrc to /spksrc inside the container, overriding the image content
          docker run --rm \
            -v "${ROOT_PATH}/spksrc-fork:/spksrc" \
            -v "${ROOT_PATH}/rr-manager:/spksrc/spk/rr-manager" \
            -w /spksrc/spk/rr-manager \
            ghcr.io/synocommunity/spksrc:latest \
            make arch-${{ matrix.target }}

      - name: Rename SPK files
        run: |
          # Determine version from Makefile and prefix based on branch
          VERSION=$(grep "^SPK_VERS" rr-manager/Makefile | cut -d' ' -f3)
          REV=$(grep "^SPK_REV" rr-manager/Makefile | cut -d' ' -f3)
          FULL_VERSION="${VERSION}-${REV}"
          
          PREFIX=""
          if [[ "${{ github.ref }}" == refs/heads/pre-release ]]; then
            PREFIX="dev-"
          fi
          
          # Find and rename all SPK files
          for SPK_FILE in spksrc-fork/packages/*.spk; do
            if [ -f "$SPK_FILE" ]; then
              ARCH="${{ matrix.target }}"
              BASENAME=$(basename "$SPK_FILE" .spk)
              NEW_NAME="rr-manager-${PREFIX}${ARCH}_${FULL_VERSION}.spk"
              cp "$SPK_FILE" "$NEW_NAME"
              echo "Created: $NEW_NAME"
            fi
          done

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            rr-manager-*.spk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/pre-release'
        with:
          files: |
            rr-manager-*.spk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}${{ github.ref == 'refs/heads/pre-release' && ' (dev)' || '' }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || github.ref == 'refs/heads/pre-release' }}
          generate_release_notes: true
